# Render blueprint — deploys the FastAPI backend + built React SPA as one
# free-tier web service. See DEPLOYMENT.md for the full setup walkthrough.
services:
  - type: web
    name: garden-app
    runtime: python
    plan: free
    # No `region:` here on purpose. The existing service was created in
    # Oregon (the default), and region is immutable — declaring a different
    # one makes every blueprint sync fail. Ideally the service would live in
    # virginia (same as Neon, us-east-1; Oregon adds ~70ms per DB query), but
    # moving requires deleting the service and re-syncing the blueprint,
    # which changes the URL and means re-entering all secrets. If you ever
    # recreate the service, add `region: virginia` back BEFORE the first sync.
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      npm ci
      npm run build --workspace apps/web
    startCommand: uv run uvicorn apps.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql+psycopg://...)
        sync: false
      - key: GCS_STATIC_BUCKET     # private bucket holding the static image tree
        sync: false
      - key: JOB_TOKEN             # shared secret for /api/admin/run-* cron endpoints
        generateValue: true
      - key: ENABLE_SCHEDULER      # in-process cron never fires on free tier
        value: '0'
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-service-account.json
      # Optional — weather provider evaluation (scripts/test_weather_providers.py).
      # Probes report status "no_key" when unset.
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: VISUAL_CROSSING_KEY
        sync: false
      - key: TOMORROW_IO_KEY
        sync: false
      - key: PYTHON_VERSION
        value: '3.11'
