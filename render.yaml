# Render blueprint — deploys the FastAPI backend + built React SPA as one
# free-tier web service. See DEPLOYMENT.md for the full setup walkthrough.
services:
  - type: web
    name: garden-app
    runtime: python
    plan: free
    # No `region:` here on purpose — region is immutable, so declaring one that
    # doesn't match makes every blueprint sync fail.
    # The live service (garden-app-wa0b, srv-d9be5kbtqb8s73ce1lbg) runs in
    # **virginia**, which is already the right place: Neon is in aws-us-east-1.
    # There is no cross-region DB latency penalty to fix.
    # (An older Oregon service, garden-app / srv-d9a3stucjfls7397c5d0, is
    # suspended. An earlier version of this comment described that one and was
    # left behind when the service moved — corrected 2026-07-26.)
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      npm ci
      npm run build --workspace apps/web
    startCommand: uv run uvicorn apps.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql+psycopg://...)
        sync: false
      - key: GCS_STATIC_BUCKET     # private bucket holding the static image tree
        sync: false
      - key: JOB_TOKEN             # shared secret for /api/admin/run-* cron endpoints
        generateValue: true
      - key: ENABLE_SCHEDULER      # in-process cron never fires on free tier
        value: '0'
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-service-account.json
      # Optional — weather provider evaluation (scripts/test_weather_providers.py).
      # Probes report status "no_key" when unset.
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: VISUAL_CROSSING_KEY
        sync: false
      - key: TOMORROW_IO_KEY
        sync: false
      - key: PYTHON_VERSION
        value: '3.11'
      # Error tracking + nightly-job cron monitors. Paste the DSN into the
      # Render dashboard — `sync: false` declares the variable but never
      # carries its value. Leave it unset locally; the SDK then no-ops.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
