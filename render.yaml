# Render blueprint — deploys the FastAPI backend + built React SPA as one
# free-tier web service. See DEPLOYMENT.md for the full setup walkthrough.
services:
  - type: web
    name: garden-app
    runtime: python
    plan: free
    # MUST be the same region as the Neon database (us-east-1 → virginia).
    # Render defaults to Oregon; every DB query then pays a ~70ms coast-to-
    # coast round trip, which multiplies into 400ms+ per API request.
    # NOTE: region can't be changed on an existing service — if the service
    # was created in the wrong region, delete it and re-sync the blueprint.
    region: virginia
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      npm ci
      npm run build --workspace apps/web
    startCommand: uv run uvicorn apps.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql+psycopg://...)
        sync: false
      - key: GCS_STATIC_BUCKET     # private bucket holding the static image tree
        sync: false
      - key: JOB_TOKEN             # shared secret for /api/admin/run-* cron endpoints
        generateValue: true
      - key: ENABLE_SCHEDULER      # in-process cron never fires on free tier
        value: '0'
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-service-account.json
      - key: PYTHON_VERSION
        value: '3.11'
