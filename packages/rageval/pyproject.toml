[project]
name = "rageval"
version = "0.1.0"
description = "App-agnostic evaluation harness for RAG systems: golden sets, LLM judges, calibration, agreement, regression gating."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
    "requests",
]

[project.scripts]
rageval = "rageval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rageval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
