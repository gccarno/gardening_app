[project]
name = "gardening-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "anthropic",
    "scikit-learn",
    "numpy",
    "pandas",
    "beautifulsoup4",
    "pdfplumber",
    # Default embedding provider for the growing-guides RAG. Needed at request
    # time to embed the query, so it belongs in core deps — but it is a thin
    # HTTP SDK, not a model. Alternate providers live in the `embed-alt` extra.
    "google-genai",
    # FastAPI backend
    "fastapi",
    "uvicorn[standard]",
    "alembic",
    "python-multipart",
    "sqlalchemy",
    "pgvector",
    "psycopg[binary]",
    "argon2-cffi",
    "pillow",
    "apscheduler>=3.10",
    "google-cloud-storage>=2.14",
    # Error tracking + cron monitors. >=2.35 is the floor for enable_logs.
    "sentry-sdk[fastapi]>=2.35",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
eda = ["matplotlib", "seaborn", "jupyter"]
monitoring = ["streamlit"]
# Offline chat-agent tracing + evaluation. MUST stay out of [project.dependencies]:
# Render builds with `uv sync --frozen --no-dev`, and MLflow has no business on a
# 512 MB free instance. Install locally with: uv pip install "mlflow>=3.8"
evaluation = ["mlflow>=3.8"]
# Alternate embedding providers. Only needed if EMBED_PROVIDER is switched off
# the `gemini` default — install the matching one and set the API key.
embed-alt = ["openai", "voyageai"]
# Image generation via HuggingFace diffusers (local GPU).
# NOTE: PyTorch with CUDA must be installed separately — uv cannot pull the CUDA wheel:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
imggen = [
    "diffusers>=0.31",
    "transformers",
    "accelerate",
    "safetensors",
    "huggingface-hub",
    "gguf",        # required for FLUX GGUF quantized models
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls the real Ollama model (requires Ollama running locally)",
    "render: calls the live Render API (requires RENDER_API_KEY in .env)",
]

[tool.uv]
package = false

# Tell uv to find PyTorch CUDA wheels from the official PyTorch index.
# Without this, `uv sync` installs the CPU-only wheel from PyPI.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx",
]
