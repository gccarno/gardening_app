name: E2E (live)

# Manually-triggered full web E2E run against the live Render deployment.
# Builds a [E2E]-prefixed garden in the production Neon DB, clicks through
# every page, and tears it down (see tests/e2e/README.md). Requires the
# E2E_USERNAME / E2E_PASSWORD repo secrets; the Android and sync-relay
# phases need an attached phone and stay local-only (scripts/run_e2e.ps1).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly regression sweep

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Write .env from secrets
        run: |
          if [ -z "${{ secrets.E2E_USERNAME }}" ]; then
            echo "E2E_USERNAME/E2E_PASSWORD secrets not set — nothing to run." && exit 1
          fi
          printf 'USERNAME=%s\nPASSWORD=%s\n' \
            "${{ secrets.E2E_USERNAME }}" "${{ secrets.E2E_PASSWORD }}" > .env
      - name: Run live E2E suite
        run: npx playwright test
        working-directory: apps/web
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            tests/e2e/artifacts/
          retention-days: 14
