name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests/unit tests/data_tests -q

  migrations:
    # Guards the failure mode behind the 2026-07-21 outage: a column added to
    # models.py but never to the database. Builds the schema from the Alembic
    # revisions alone against a throwaway Postgres, then asserts the result
    # matches models.py. No Neon credential, never touches production.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garden_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/garden_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Build schema from migrations only
        run: uv run alembic upgrade head
      - name: Assert schema matches models.py
        # Fails with "New upgrade operations detected: [('add_column', ...)]"
        # when a model change has no matching revision.
        run: uv run alembic check
      - name: Assert migrations are reversible
        run: uv run alembic downgrade base

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace apps/web
      - name: Test
        run: npm test --workspace apps/web

  android:
    runs-on: ubuntu-latest
    # JVM unit tests only (no emulator). Runs when Android code changes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
