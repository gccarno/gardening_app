name: Train Model

# Trains the watering-model regression model (ml/training/train_watering.py).
# This is deliberately NOT wired to auto-deploy: it uploads the trained
# artifact + metrics as a workflow run artifact, and a human reviews the
# numbers and commits ml/models/watering.pkl themselves (Render then
# redeploys on the next push, same as any other change). See
# ml/docs/WATERING_MODEL.md, step 7, for why promotion is manual.
#
# Optional repo secret:
#   DATABASE_URL   Neon connection string. When set, real flywheel data
#                  (ml/data/export_watering_snapshots.py) is exported and
#                  blended with the synthetic bootstrap data. Without it,
#                  training runs on synthetic data only — still useful for
#                  regression-testing the pipeline itself.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'   # 08:00 UTC on the 1st of each month

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync

      - name: Generate synthetic bootstrap data
        run: uv run python ml/data/generate_watering_synthetic.py

      - name: Export real flywheel data
        if: env.DATABASE_URL != ''
        run: uv run python ml/data/export_watering_snapshots.py

      - name: Train + evaluate (fails the run if the eval gate isn't met)
        run: uv run python ml/training/train_watering.py | tee ml/models/train_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: watering-model
          path: |
            ml/models/watering.pkl
            ml/models/train_report.txt
          retention-days: 90
