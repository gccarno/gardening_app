name: Scheduled jobs

# Replaces in-process APScheduler in the cloud deployment: the free-tier host
# spins down when idle, so these requests both wake it (and the Neon database)
# and trigger the nightly work.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL    https://garden-app-wa0b.onrender.com  (NOT the unsuffixed
#              garden-app.onrender.com — that is someone else's site)
#   JOB_TOKEN  same value as the JOB_TOKEN env var on the server
#
# Until those secrets are set (i.e. before the app is deployed to Render),
# the job logs a notice and exits green instead of failing every night.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC ≈ 2 AM Central — weather fetch
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
    steps:
      - name: Skip if not configured
        if: env.APP_URL == ''
        run: |
          echo "::notice::APP_URL / JOB_TOKEN secrets are not set — nothing to trigger yet. Set them after deploying (DEPLOYMENT.md, section 4)."
      - name: Fetch weather for all gardens
        if: env.APP_URL != ''
        run: |
          curl -sSf -X POST "$APP_URL/api/admin/run-weather-fetch" \
            -H "X-Job-Token: $JOB_TOKEN" \
            --retry 3 --retry-delay 30 --max-time 120
      - name: Snapshot watering-model training data
        if: env.APP_URL != ''
        run: |
          curl -sSf -X POST "$APP_URL/api/admin/run-ml-snapshot" \
            -H "X-Job-Token: $JOB_TOKEN" \
            --retry 3 --retry-delay 30 --max-time 120
      - name: Run backup job
        if: env.APP_URL != ''
        run: |
          curl -sSf -X POST "$APP_URL/api/admin/run-backup" \
            -H "X-Job-Token: $JOB_TOKEN" \
            --retry 3 --retry-delay 30 --max-time 120
