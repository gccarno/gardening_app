name: Scheduled jobs

# Replaces in-process APScheduler in the cloud deployment: the free-tier host
# spins down when idle, so these requests both wake it (and the Neon database)
# and trigger the nightly work.
#
# Required repo secrets:
#   APP_URL    e.g. https://garden-app.onrender.com
#   JOB_TOKEN  same value as the JOB_TOKEN env var on the server

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC ≈ 2 AM Central — weather fetch
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch weather for all gardens
        run: |
          curl -sf -X POST "$APP_URL/api/admin/run-weather-fetch" \
            -H "X-Job-Token: $JOB_TOKEN" \
            --retry 3 --retry-delay 30 --max-time 120
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
      - name: Run backup job
        run: |
          curl -sf -X POST "$APP_URL/api/admin/run-backup" \
            -H "X-Job-Token: $JOB_TOKEN" \
            --retry 3 --retry-delay 30 --max-time 120
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
